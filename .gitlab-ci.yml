stages:
  - image
  - translator
  - theory
  - all
  - pages

variables:
  DEPS_IMAGE: $CI_REGISTRY_IMAGE/deps:latest

# Build the dependency image (opam switch with rocq, iris, stdpp, …) and push
# it to the project's container registry. Only runs when:
#   - the inputs (Dockerfile / Makefile) actually change, or
#   - a pipeline is run with REBUILD_DEPS_IMAGE set (via "Run Pipeline" UI).
# Otherwise the job is absent from the pipeline, so downstream jobs (which
# need it `optional: true`) start immediately against the existing image.
build-deps-image:
  stage: image
  tags:
    - ci
  image: docker:27-cli
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/Dockerfile
        - Makefile
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/Dockerfile
        - Makefile
    - if: $REBUILD_DEPS_IMAGE
  script:
    - docker build -f docker/Dockerfile -t "$DEPS_IMAGE" .
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker push "$DEPS_IMAGE"

# Per-job dune cache: each job keeps its own _build/ across pipelines, keyed
# on the branch + job + the files that pin tool / dependency versions. This
# avoids the merge problem of multiple jobs uploading partial _build/ trees
# as artifacts. translator/theory/all still run in parallel-or-sequence per
# their `needs:`, but each pulls its OWN warm cache from the prior pipeline.
.dune_cache: &dune_cache
  cache:
    key:
      files:
        - Makefile
        - osiris/dune-project
      prefix: $CI_COMMIT_REF_SLUG-$CI_JOB_NAME
    paths:
      - _build/

translator:
  stage: translator
  tags:
    - ci
  image: $DEPS_IMAGE
  needs:
    - job: build-deps-image
      optional: true
  script:
    - cd osiris
    - dune build
    - dune runtest
  <<: *dune_cache
  artifacts:
    when: always
    expire_in: 1 hour
    paths:
      - _build/**/junit-*.xml
    reports:
      junit: _build/**/junit-*.xml

theory:
  stage: theory
  tags:
    - ci
  image: $DEPS_IMAGE
  needs:
    - job: build-deps-image
      optional: true
  script:
    - make theory
  <<: *dune_cache

all:
  stage: all
  tags:
    - ci
  image: $DEPS_IMAGE
  needs:
    - job: build-deps-image
      optional: true
    - job: translator
      artifacts: false
    - job: theory
      artifacts: false
  script:
    - make
  <<: *dune_cache

pages:
  stage: pages
  script:
    - mkdir public
    - cp -r rocq-osiris/tutorial/* public
  artifacts:
    paths:
      # The folder that contains the files to be exposed at the Page URL
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      changes:
        - rocq-osiris/tutorial/*
