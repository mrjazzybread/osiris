stages:
  - image
  - translator
  - translate
  - rocq-osiris
  - stdlib
  - examples
  - interp
  - test
  - pages

variables:
  DEPS_IMAGE: $CI_REGISTRY_IMAGE/deps:latest

# Build the dependency image (opam switch with rocq, iris, stdpp, …) and push
# it to the project's container registry. Only runs when the Dockerfile or
# Makefile change, or when REBUILD_DEPS_IMAGE is set via the "Run Pipeline" UI.
build-deps-image:
  stage: image
  tags:
    - ci
  image: docker:27-cli
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/Dockerfile
        - Makefile
    - if: $REBUILD_DEPS_IMAGE
  script:
    - docker build --no-cache -f docker/Dockerfile -t "$DEPS_IMAGE" .
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker push "$DEPS_IMAGE"

# Shared _build/ cache, scoped to the pipeline so each pipeline starts clean
# but sequential jobs accumulate each other's build outputs.
.cache: &cache
  cache:
    key: $CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID
    paths:
      - _build/

translator:
  stage: translator
  tags:
    - ci
  image: $DEPS_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build-deps-image
      optional: true
  script:
    - make translator
  <<: *cache

translate:
  stage: translate
  tags:
    - ci
  image: $DEPS_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: translator
  script:
    - dune build @rocq-osiris/stdlib/src/all @examples/src/all --display=short
    - (cd osiris && dune exec src/Main.exe -- --root "$CI_PROJECT_DIR" --out "$CI_PROJECT_DIR" --mark og_ --no-warnings --decorate all)
    - mv rocq-osiris/stdlib/src/*.v rocq-osiris/stdlib/
    - mv examples/src/*.v examples/
  <<: *cache
  artifacts:
    paths:
      - rocq-osiris/stdlib/og_*.v
      - examples/og_*.v
    expire_in: 1 hour

rocq-osiris:
  stage: rocq-osiris
  tags:
    - ci
  image: $DEPS_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: translate
  script:
    - make theory
  <<: *cache

stdlib:
  stage: stdlib
  tags:
    - ci
  image: $DEPS_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: rocq-osiris
    - job: translate
      artifacts: true
  script:
    - dune build rocq-osiris/stdlib
  <<: *cache

examples:
  stage: examples
  tags:
    - ci
  image: $DEPS_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: stdlib
    - job: translate
      artifacts: true
  script:
    - dune build examples
  <<: *cache

interp:
  stage: interp
  tags:
    - ci
  image: $DEPS_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: examples
  script:
    - dune build interp
  <<: *cache

test:
  stage: test
  tags:
    - ci
  image: $DEPS_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: interp
  script:
    - make runtests
  <<: *cache

pages:
  stage: pages
  script:
    - mkdir public
    - cp -r rocq-osiris/tutorial/* public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      changes:
        - rocq-osiris/tutorial/*
